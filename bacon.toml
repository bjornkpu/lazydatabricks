default_job = "clippy-all"

[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--all-features", "--hide-progress-bar", "--failure-output", "final"]
need_stdout = true
analyzer = "nextest"

[keybindings]
c = "job:clippy-all"
n = "job:nextest"
t = "job:nextest"
